name: DEX research tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [feature/dex-research-agent]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run DEX research unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_dex_research*.py" -v
