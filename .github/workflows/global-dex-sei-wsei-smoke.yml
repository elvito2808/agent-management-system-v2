name: Global DEX SEI and WSEI live smoke test

on:
  workflow_dispatch:
  push:
    branches: [feature/global-multichain-dex-research]

jobs:
  sei-wsei-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query WSEI pools on Sei EVM
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts
          python scripts/global_dex_research.py WSEI --network sei-evm --format json --output artifacts/wsei-sei-evm.json
      - name: Summarize WSEI results
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/wsei-sei-evm.json")
          if not path.exists():
              print("No report file was produced.")
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          pools = [
              p for p in report.get("pools", [])
              if p.get("network", "").casefold() == "sei-evm"
              and any((t.get("symbol") or "").upper() in {"SEI", "WSEI"} for t in (p.get("token0", {}), p.get("token1", {})))
          ]
          print(f"query={report.get('query')}; status={report.get('status')}; matching_pools={len(pools)}")
          print(f"networks={report.get('networks_found')}; dexes={report.get('dexes_found')}")
          print(f"providers={report.get('providers_searched')}; provider_issues={len(report.get('issues', []))}")
          for p in pools[:40]:
              print(
                  f"DEX={p.get('dex_name')} pair={p.get('token0', {}).get('symbol')}/{p.get('token1', {}).get('symbol')} "
                  f"liquidity_usd={p.get('liquidity_usd')} volume_24h_usd={p.get('volume_24h_usd')} "
                  f"pool={p.get('pool_id')} url={p.get('pool_url')} source={p.get('source')}"
              )
          PY
      - name: Require at least one indexed WSEI pool on Sei EVM
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/wsei-sei-evm.json").read_text(encoding="utf-8"))
          pools = [
              p for p in report.get("pools", [])
              if p.get("network", "").casefold() == "sei-evm"
              and any((t.get("symbol") or "").upper() == "WSEI" for t in (p.get("token0", {}), p.get("token1", {})))
          ]
          if not pools:
              print(f"No indexed WSEI pool found. status={report.get('status')}; issues={report.get('issues', [])}")
              raise SystemExit(1)
          print(f"PASS: found {len(pools)} indexed WSEI pool(s) on Sei EVM.")
          PY
      - name: Upload SEI/WSEI report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sei-wsei-live-report
          path: artifacts/wsei-sei-evm.json
          if-no-files-found: warn
