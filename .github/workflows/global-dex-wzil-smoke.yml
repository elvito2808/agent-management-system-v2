name: Global DEX WZIL live smoke test

on:
  workflow_dispatch:
  push:
    branches: [feature/global-multichain-dex-research]

jobs:
  wzil-zilliqa-evm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Query WZIL pools on Zilliqa EVM
        env:
          PYTHONPATH: src
        run: |
          mkdir -p artifacts
          python scripts/global_dex_research.py WZIL --network zilliqa-evm --format json --output artifacts/wzil-zilliqa-evm.json
      - name: Summarize WZIL results
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/wzil-zilliqa-evm.json")
          if not path.exists():
              print("No report file was produced.")
              raise SystemExit(0)
          report = json.loads(path.read_text(encoding="utf-8"))
          pools = report.get("pools", [])
          wzil = [
              p for p in pools
              if p.get("network") == "zilliqa-evm"
              and any((t.get("symbol") or "").upper() == "WZIL" for t in (p.get("token0", {}), p.get("token1", {})))
          ]
          print(f"query={report.get('query')}; status={report.get('status')}; matching_pools={len(wzil)}")
          print(f"networks={report.get('networks_found')}; dexes={report.get('dexes_found')}")
          print(f"providers={report.get('providers_searched')}; provider_issues={len(report.get('issues', []))}")
          for p in wzil[:20]:
              print(
                  f"DEX={p.get('dex_name')} pair={p.get('token0', {}).get('symbol')}/{p.get('token1', {}).get('symbol')} "
                  f"liquidity_usd={p.get('liquidity_usd')} volume_24h_usd={p.get('volume_24h_usd')} "
                  f"pool={p.get('pool_id')} url={p.get('pool_url')} source={p.get('source')}"
              )
          PY
      - name: Require at least one indexed WZIL pool
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/wzil-zilliqa-evm.json").read_text(encoding="utf-8"))
          pools = [
              p for p in report.get("pools", [])
              if p.get("network") == "zilliqa-evm"
              and any((t.get("symbol") or "").upper() == "WZIL" for t in (p.get("token0", {}), p.get("token1", {})))
          ]
          if not pools:
              issues = report.get("issues", [])
              print(f"No matching indexed WZIL pool found. status={report.get('status')}; issues={issues}")
              raise SystemExit(1)
          print(f"PASS: found {len(pools)} indexed WZIL pool(s) on Zilliqa EVM.")
          PY
      - name: Upload WZIL report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wzil-zilliqa-evm-live-report
          path: artifacts/wzil-zilliqa-evm.json
          if-no-files-found: warn
